<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créditos — Brincar no Quintal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .fld { width:100%; border:1px solid #cbd5e1; border-radius:6px; padding:6px 8px; font-size:.85rem; background:#fff; }
  .fld:focus { outline:2px solid #1e3a8a33; }
  .lbl { font-size:.7rem; text-transform:uppercase; letter-spacing:.03em; color:#64748b; font-weight:600; }
  ::-webkit-scrollbar { height:8px; width:8px; } ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

<main class="max-w-7xl mx-auto px-4 py-5">
  <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
    <div class="flex gap-2 items-center flex-wrap">
      <input type="text" id="busca" placeholder="🔎 responsável ou criança…" class="fld !w-64">
      <select id="fPrograma" class="fld !w-44">
        <option value="todos">Contraturno + Colônia</option>
        <option value="Contraturno">Só Contraturno</option>
        <option value="Colonia">Só Colônia</option>
      </select>
      <label class="text-xs flex items-center gap-1"><input type="checkbox" id="fSaldo"> só com saldo &gt; 0</label>
    </div>
    <button onclick="abrirConverter()" class="bg-slate-700 text-white text-sm px-4 py-2 rounded hover:bg-slate-600">🔄 Converter saldo</button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="bg-white rounded-lg border border-slate-200 overflow-y-auto max-h-[75vh]" id="listaResp"></div>
    <div class="lg:col-span-2 space-y-4" id="detalhe">
      <div class="bg-white rounded-lg border border-dashed border-slate-300 p-10 text-center text-slate-500">
        Selecione um responsável para ver saldos e registrar consumo.
      </div>
    </div>
  </div>
</main>

<script src="shared/api.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/ui.js"></script>
<script>
if (AUTH.protegerPagina('contraturno')) {

UI.montarHeader('🎨 Créditos — Contraturno & Colônia');
let codSel = null;

const UNI = { Contraturno: 'h', Colonia: 'turno(s)' };

/* ============ SALDOS ============ */
function movsDo(cod) { return API.tabela('movimentos').filter(m => m.cod_responsavel === cod); }
function saldo(cod, prog) {
  return movsDo(cod).filter(m => m.programa === prog).reduce((s, m) => s + (+m.qtde || 0), 0);
}
function temQualquerSaldo(cod) { return saldo(cod, 'Contraturno') > 0 || saldo(cod, 'Colonia') > 0; }

/* ============ LISTA ============ */
function renderLista() {
  const box = document.getElementById('listaResp');
  const q = (document.getElementById('busca').value || '').toLowerCase();
  const soSaldo = document.getElementById('fSaldo').checked;
  const criancas = API.tabela('criancas');
  let resps = [...API.tabela('responsaveis')].sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  if (q) resps = resps.filter(r => (r.nome || '').toLowerCase().includes(q) ||
    criancas.some(c => c.cod_responsavel === r.cod && (c.nome || '').toLowerCase().includes(q)));
  if (soSaldo) resps = resps.filter(r => temQualquerSaldo(r.cod));

  box.innerHTML = resps.length ? resps.map(r => {
    const ct = saldo(r.cod, 'Contraturno'), co = saldo(r.cod, 'Colonia');
    return `<button onclick="selecionar('${r.cod}')" class="w-full text-left px-4 py-3 border-b border-slate-100 hover:bg-blue-50 ${codSel === r.cod ? 'bg-blue-50' : ''}">
      <p class="font-semibold text-sm">${UI.esc(r.nome)}</p>
      <p class="text-xs mt-0.5">
        <span class="${ct < 0 ? 'text-red-600' : ct > 0 ? 'text-emerald-700' : 'text-slate-400'}">CT ${UI.fmtNum(ct)}h</span> ·
        <span class="${co < 0 ? 'text-red-600' : co > 0 ? 'text-cyan-700' : 'text-slate-400'}">Col ${UI.fmtNum(co)} turno(s)</span>
      </p>
    </button>`;
  }).join('') : '<p class="p-6 text-slate-500 text-sm">Nenhum responsável no filtro.</p>';
}
function selecionar(cod) { codSel = cod; renderLista(); renderDetalhe(); }

/* ============ DETALHE ============ */
function renderDetalhe() {
  const box = document.getElementById('detalhe');
  const r = API.tabela('responsaveis').find(x => x.cod === codSel);
  if (!r) return;
  const filhos = API.tabela('criancas').filter(c => c.cod_responsavel === r.cod);
  const ct = saldo(r.cod, 'Contraturno'), co = saldo(r.cod, 'Colonia');
  const progFiltro = document.getElementById('fPrograma').value;
  let movs = movsDo(r.cod).filter(m => progFiltro === 'todos' || m.programa === progFiltro);
  movs = movs.sort((a, b) => (b.data || '').localeCompare(a.data || ''));

  box.innerHTML = `
    <article class="bg-white rounded-lg border border-slate-200 p-4">
      <div class="flex justify-between items-start">
        <div><h3 class="font-bold text-lg">${UI.esc(r.nome)}</h3>
          <p class="text-xs text-slate-500">${r.cod} · ${filhos.length} criança(s)</p></div>
        <button onclick="abrirConsumo()" class="bg-blue-900 text-white text-xs px-3 py-1.5 rounded hover:bg-blue-800">− Registrar consumo</button>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-3">
        <div class="bg-emerald-50 border border-emerald-200 rounded p-3">
          <p class="lbl">Saldo Contraturno</p>
          <p class="text-2xl font-bold ${ct < 0 ? 'text-red-600' : 'text-emerald-700'}">${UI.fmtNum(ct)} <span class="text-sm font-normal">horas</span></p>
        </div>
        <div class="bg-cyan-50 border border-cyan-200 rounded p-3">
          <p class="lbl">Saldo Colônia</p>
          <p class="text-2xl font-bold ${co < 0 ? 'text-red-600' : 'text-cyan-700'}">${UI.fmtNum(co)} <span class="text-sm font-normal">turno(s) 4h</span></p>
        </div>
      </div>
    </article>

    <article class="bg-white rounded-lg border border-slate-200 overflow-x-auto">
      <h3 class="font-semibold px-4 pt-3">Extrato de movimentos</h3>
      <table class="w-full text-sm mt-2">
        <thead class="text-xs text-slate-500 uppercase border-b border-slate-200"><tr>
          <th class="text-left px-4 py-1">Data</th><th class="text-left">Programa</th><th class="text-left">Tipo</th>
          <th class="text-left">Criança</th><th class="text-left">Pacote/Obs</th><th class="text-right px-4">Qtde</th></tr></thead>
        <tbody>${movs.length ? movs.map(m => `<tr class="border-b border-slate-50">
          <td class="px-4 py-2 whitespace-nowrap">${m.data || ''}</td>
          <td>${m.programa === 'Colonia' ? '🏖️ Colônia' : '🎨 Contraturno'}</td>
          <td>${m.tipo_entrada === 'Contratado' ? '<span class="text-emerald-700">+ Contratado</span>' : m.tipo_entrada === 'Realizado' ? '<span class="text-red-700">− Realizado</span>' : UI.esc(m.tipo_entrada)}</td>
          <td class="text-xs">${UI.esc(m.nome_crianca || '—')}</td>
          <td class="text-xs">${UI.esc(m.pacote || m.observacoes || '')}</td>
          <td class="px-4 py-2 text-right font-semibold ${(+m.qtde || 0) < 0 ? 'text-red-700' : 'text-emerald-700'}">${(+m.qtde || 0) > 0 ? '+' : ''}${UI.fmtNum(m.qtde)} ${UNI[m.programa] || ''}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="px-4 py-4 text-center text-slate-400">Nenhum movimento.</td></tr>'}
        </tbody></table>
    </article>`;
}

/* ============ REGISTRAR CONSUMO (Realizado, negativo) ============ */
function abrirConsumo() {
  const r = API.tabela('responsaveis').find(x => x.cod === codSel);
  const filhos = API.tabela('criancas').filter(c => c.cod_responsavel === r.cod);
  if (!filhos.length) { UI.toast('Cadastre uma criança para este responsável primeiro.', 'erro'); return; }
  UI.modal(`<div class="p-5">
    <h3 class="font-bold text-lg mb-1">− Registrar consumo</h3>
    <p class="text-xs text-slate-500 mb-3">Responsável: <b>${UI.esc(r.nome)}</b>. O consumo abate do saldo (fica no responsável), mas registra qual criança usou.</p>
    <div class="grid grid-cols-6 gap-2">
      <div class="col-span-2"><span class="lbl">Data</span><input type="date" id="c_data" class="fld" value="${UI.hoje()}"></div>
      <div class="col-span-2"><span class="lbl">Programa</span><select id="c_prog" class="fld" onchange="ajustaUnidade()">
        <option value="Contraturno">🎨 Contraturno (horas)</option><option value="Colonia">🏖️ Colônia (turnos 4h)</option></select></div>
      <div class="col-span-2"><span class="lbl">Turno</span><select id="c_turno" class="fld"><option>Manhã</option><option>Tarde</option><option>Integral</option></select></div>
      <div class="col-span-4"><span class="lbl">Criança</span><select id="c_crianca" class="fld">${filhos.map(f => `<option value="${f.id_crianca}">${UI.esc(f.nome)}</option>`).join('')}</select></div>
      <div class="col-span-2"><span class="lbl" id="c_lblqtd">Qtde (horas)</span><input type="number" step="0.5" id="c_qtde" class="fld" placeholder="ex: 2"></div>
      <div class="col-span-6"><span class="lbl">Observações</span><input id="c_obs" class="fld" placeholder="ex: entrou 14h, saiu 18h"></div>
    </div>
    <div class="flex justify-end gap-2 mt-4">
      <button onclick="salvarConsumo()" class="bg-blue-900 text-white text-sm px-5 py-2 rounded hover:bg-blue-800">💾 Registrar</button>
    </div></div>`, 'max-w-2xl');
}
function ajustaUnidade() {
  const p = document.getElementById('c_prog').value;
  document.getElementById('c_lblqtd').textContent = p === 'Colonia' ? 'Qtde (turnos)' : 'Qtde (horas)';
}
async function salvarConsumo() {
  const g = k => document.getElementById('c_' + k).value;
  const qtde = +g('qtde');
  if (!qtde || qtde <= 0) { UI.toast('Informe a quantidade consumida.', 'erro'); return; }
  const crianca = API.tabela('criancas').find(c => c.id_crianca === g('crianca'));
  const mov = {
    data: g('data'), cod_responsavel: codSel, programa: g('prog'), tipo_entrada: 'Realizado',
    id_crianca: g('crianca'), nome_crianca: crianca ? crianca.nome : '',
    qtde: -Math.abs(qtde), turno: g('turno'), observacoes: g('obs')
  };
  UI.syncBusy();
  try {
    const r = await API.upsert('movimentos', mov);
    if (!r.ok) throw new Error(r.erro);
    UI.fecharModal(); UI.syncOk(); UI.toast('Consumo registrado.', 'ok');
    renderLista(); renderDetalhe();
  } catch (e) { UI.syncErr(); UI.toast('Erro: ' + e.message, 'erro'); }
}

/* ============ CONVERSÃO DE SALDO (proporcional ao preço de tabela) ============ */
function precoUnit(programa) {
  // Contraturno = R$/hora (valor_pacote / horas). Colônia = R$/turno.
  const pk = API.tabela('param_pacotes');
  if (programa === 'Colonia') {
    const c = pk.find(p => (p.programa === 'Colonia'));
    return c ? (+c['valor_R$'] || +c.preco_unit_R$ || 0) : 0;
  }
  // contraturno: média de preço/hora dos pacotes de horas com valor preenchido
  const hs = pk.filter(p => p.programa === 'Contraturno' && +p['valor_R$'] > 0 && +p.qtd_horas_ou_turnos > 0);
  if (!hs.length) return 0;
  return hs.reduce((s, p) => s + (+p['valor_R$'] / +p.qtd_horas_ou_turnos), 0) / hs.length;
}

function abrirConverter() {
  if (!codSel) { UI.toast('Selecione um responsável primeiro.', 'erro'); return; }
  const r = API.tabela('responsaveis').find(x => x.cod === codSel);
  const ct = saldo(codSel, 'Contraturno'), co = saldo(codSel, 'Colonia');
  const pCT = precoUnit('Contraturno'), pCol = precoUnit('Colonia');
  const avisoPreco = (!pCT || !pCol)
    ? '<p class="text-xs text-red-600 mt-1">⚠ Preencha os valores em param_pacotes (via importação/admin) para a conversão calcular corretamente. Preços atuais: CT R$' + UI.fmtNum(pCT) + '/h · Colônia R$' + UI.fmtNum(pCol) + '/turno.</p>'
    : '<p class="text-xs text-slate-500 mt-1">Preços de tabela: Contraturno R$' + UI.fmtNum(pCT) + '/h · Colônia R$' + UI.fmtNum(pCol) + '/turno (4h).</p>';
  UI.modal(`<div class="p-5">
    <h3 class="font-bold text-lg mb-1">🔄 Converter saldo</h3>
    <p class="text-xs text-slate-500">Responsável: <b>${UI.esc(r.nome)}</b> · Saldos: CT ${UI.fmtNum(ct)}h · Colônia ${UI.fmtNum(co)} turno(s).</p>
    ${avisoPreco}
    <div class="grid grid-cols-6 gap-2 mt-3">
      <div class="col-span-3"><span class="lbl">De (origem)</span><select id="cv_origem" class="fld" onchange="calcConversao()">
        <option value="Colonia">🏖️ Colônia → 🎨 Contraturno</option>
        <option value="Contraturno">🎨 Contraturno → 🏖️ Colônia</option></select></div>
      <div class="col-span-3"><span class="lbl">Qtde a converter (na origem)</span><input type="number" step="0.5" id="cv_qtde" class="fld" oninput="calcConversao()" placeholder="ex: 2"></div>
    </div>
    <div class="bg-blue-50 border border-blue-200 rounded p-3 mt-3 text-sm" id="cv_preview">Informe a quantidade para ver o resultado.</div>
    <div class="flex justify-end gap-2 mt-4">
      <button onclick="confirmarConversao()" class="bg-blue-900 text-white text-sm px-5 py-2 rounded hover:bg-blue-800">Converter</button>
    </div></div>`, 'max-w-2xl');
}

function dadosConversao() {
  const origem = document.getElementById('cv_origem').value;
  const destino = origem === 'Colonia' ? 'Contraturno' : 'Colonia';
  const qtde = +document.getElementById('cv_qtde').value || 0;
  const pOrig = precoUnit(origem), pDest = precoUnit(destino);
  const valor = qtde * pOrig;
  const qtdeDest = pDest ? valor / pDest : 0;
  return { origem, destino, qtde, pOrig, pDest, valor, qtdeDest };
}
function calcConversao() {
  const d = dadosConversao();
  const box = document.getElementById('cv_preview');
  if (!d.qtde) { box.textContent = 'Informe a quantidade para ver o resultado.'; return; }
  if (!d.pOrig || !d.pDest) { box.innerHTML = '<span class="text-red-600">Preços não configurados — não é possível converter.</span>'; return; }
  const uO = d.origem === 'Colonia' ? 'turno(s)' : 'h', uD = d.destino === 'Colonia' ? 'turno(s)' : 'h';
  box.innerHTML = `Convertendo <b>${UI.fmtNum(d.qtde)} ${uO}</b> de ${d.origem}
    → valor R$ ${UI.fmtNum(d.valor)}
    → <b class="text-blue-800">${UI.fmtNum(d.qtdeDest)} ${uD}</b> de ${d.destino}.
    <br><span class="text-xs text-slate-500">O valor em reais é preservado na troca.</span>`;
}
async function confirmarConversao() {
  const d = dadosConversao();
  if (!d.qtde || !d.pOrig || !d.pDest) { UI.toast('Verifique quantidade e preços.', 'erro'); return; }
  const saldoOrig = saldo(codSel, d.origem);
  if (d.qtde > saldoOrig && !confirm(`Saldo de origem é ${UI.fmtNum(saldoOrig)}. Converter ${UI.fmtNum(d.qtde)} deixará negativo. Continuar?`)) return;
  UI.syncBusy();
  try {
    const r = await API.converterSaldo({
      cod_responsavel: codSel, origem: d.origem, destino: d.destino,
      qtde_origem: d.qtde, preco_unit_origem: d.pOrig, preco_unit_destino: d.pDest
    });
    if (!r.ok) throw new Error(r.erro);
    UI.fecharModal(); UI.syncOk(); UI.toast('Convertido: ' + UI.fmtNum(r.qtde_destino) + ' no destino.', 'ok');
    renderLista(); renderDetalhe();
  } catch (e) { UI.syncErr(); UI.toast('Erro: ' + e.message, 'erro'); }
}

/* ============ BOOT ============ */
['busca', 'fPrograma', 'fSaldo'].forEach(id =>
  document.getElementById(id).addEventListener(id === 'busca' ? 'input' : 'change', () => { renderLista(); if (codSel) renderDetalhe(); }));

(async () => {
  API.carregarLocal();
  UI.syncBusy();
  try { await API.baixar(); UI.syncOk(); } catch (e) { UI.syncErr(); }
  renderLista();
})();

} // fim protegerPagina
</script>
</body>
</html>
